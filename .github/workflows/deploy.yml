# Kanon's deploy lane (docs/lanes.md, "The deploy lane"): each published release of a green main commit is gated, its production
# role is probed from outside the environment, it is built once with no credential (.github/actions/build), and then
# `production / deploy` waits for the Owner, production's required reviewer, before it deploys (.github/actions/deploy) and checks
# the site (.github/actions/smoke). Production is the one environment (docs/qa/adoption.md, `## Deploy`). To deploy a release again,
# or roll back, dispatch this at the release's tag: `gh workflow run deploy.yml --ref <tag> -f release=<tag>`.
name: Deploy
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release: { type: string, required: true }
permissions: {}
jobs:
  release:
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
      issues: write
    uses: yedeya-labs/kanon/.github/workflows/deploy-release.yml@candidate-v0.44.0
    with: { environments: 'production', targets: '${{ vars.KANON_DEPLOY_TARGETS }}' }
  deploy-1:
    name: production
    needs: release
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
      issues: write
    uses: yedeya-labs/kanon/.github/workflows/deploy.yml@candidate-v0.44.0
    with: { environment: production, position: 1, build: '${{ needs.release.outputs.build }}', targets: '${{ needs.release.outputs.targets }}' }
    secrets:
      KANON_CHAT_DEPLOY: ${{ secrets.KANON_CHAT_DEPLOY }}
      KANON_DEPLOY_SECRET: ${{ secrets.KANON_DEPLOY_SECRET }}
